  window.global = window;

<style>
  #docs-root > .sbdocs-wrapper {
    padding: 0px 20px;
  }
  #storybook-docs > .sbdocs-wrapper > .sbdocs-content > .sbdocs-title {
    display: none;
  }
  #storybook-docs > .sbdocs-wrapper > .sbdocs-content > p:nth-child(2) {
    display: none;
  }
  #story--react-molecules-flyout--flyout {
    margin: 50px 0;

  #story--react-organisms-header--header {
    margin-bottom: 100px;

  #story--react-molecules-datepicker--datepicker {
    margin-bottom: 400px;
  }
  code {
    white-space: normal !important;
  }
</style>
<script type="application/javascript">
  async function main() {
    const params = new URLSearchParams(window.location.search);
    const coreVersion = params.get('coreVersion') || '7.1.0';
    const coreLink = document.createElement('link');
    coreLink.rel = 'stylesheet';
    coreLink.href = `https://cdn.antwerpen.be/core_branding_scss/${coreVersion}/main.min.css`;
    document.head.appendChild(coreLink);

    const branding = params.get('branding');
    const file = params.get('file');
    if (branding && file) {
      const version = params.get('version') || '1.0.0';
      const overrideLink = document.createElement('link');
      overrideLink.rel = 'stylesheet';
      overrideLink.href = `https://cdn.antwerpen.be/${branding}/${version}/${file}.min.css`;
      document.head.appendChild(overrideLink);

      console.log(`Loaded override branding: ${overrideLink.href}`);
    }

    console.log(`Loaded core branding: ${coreLink.href}`);
  }

  main();
</script>
